<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venus Engineering Works — Contract Review (QuotationCR)</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b1220;
    --ink-soft:#1f2937;
    --muted:#64748b;
    --border:#0b1220;
    --line:#e5e7eb;
    --line-2:#f1f5f9;
    --bg:#f6f7fb;
    --card:#ffffff;
    --accent:#2563eb;
    --accent-2:#7c3aed;
    --accent-soft:#eef2ff;
    --hilite:#fff7d6;
    --success:#10b981;
    --warn:#f59e0b;
    --shadow-sm:0 1px 2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.04);
    --shadow-md:0 6px 18px rgba(15,23,42,.06), 0 2px 6px rgba(15,23,42,.04);
    --shadow-lg:0 24px 50px -12px rgba(15,23,42,.18), 0 8px 16px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Poppins',system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:#fff;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ===== APP HEADER ===== */
  .app-header{
    max-width:1500px;margin:1.4rem auto .6rem;padding:0 1.25rem;
    display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
  }
  .app-brand{display:flex;flex-direction:column;line-height:1.15;}
  .app-brand .title{
    font-size:1.6rem;font-weight:700;letter-spacing:-.02em;color:var(--ink);
  }
  .app-brand .title .ver{
    font-size:.95rem;font-weight:500;color:var(--muted);margin-left:.4rem;
    letter-spacing:0;
  }
  .app-brand .subtitle{
    font-size:.78rem;color:#c0392b;font-weight:600;
    letter-spacing:.04em;text-transform:uppercase;margin-top:.15rem;
  }

  .toolbar{margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;}
  .btn{
    font-family:inherit;font-size:.82rem;font-weight:600;
    padding:.55rem .95rem;border-radius:10px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--ink);
    display:inline-flex;align-items:center;gap:.45rem;
    transition:transform .08s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
    box-shadow:var(--shadow-sm);
  }
  .btn:hover{background:#fafbff;border-color:#cbd5e1;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{
    background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);
    color:#fff;border-color:transparent;
    box-shadow:0 8px 20px -6px rgba(37,99,235,.5);
  }
  .btn.primary:hover{filter:brightness(1.05);}

  /* QCR (default blue) outlined btns tint */
  .btn:not(.primary){
    border-color:#bfdbfe;color:#1e3a8a;
  }
  .btn:not(.primary):hover{background:#eff6ff;border-color:#93c5fd;}

  /* ===== TABS ===== */
  .app-tabs{
    max-width:1500px;margin:0 auto 1.2rem;padding:.4rem 1.25rem 1.2rem;
    display:flex;justify-content:center;
  }
  .radio-inputs{
    position:relative;display:flex;flex-wrap:wrap;
    border-radius:1rem;
    background:linear-gradient(145deg,#e6e6e6,#ffffff);
    box-sizing:border-box;
    box-shadow:
      5px 5px 15px rgba(0,0,0,0.15),
      -5px -5px 15px rgba(255,255,255,0.8);
    padding:0.5rem;
    width:480px;font-size:14px;gap:0.5rem;
  }
  .radio-inputs .radio{
    flex:1 1 auto;text-align:center;position:relative;
  }
  .radio-inputs .radio input{display:none;}
  .radio-inputs .radio .name{
    display:flex;cursor:pointer;align-items:center;justify-content:center;
    border-radius:0.7rem;border:none;padding:0.7rem 0;
    color:#2d3748;font-weight:500;font-family:inherit;
    background:linear-gradient(145deg,#ffffff,#e6e6e6);
    box-shadow:
      3px 3px 6px rgba(0,0,0,0.1),
      -3px -3px 6px rgba(255,255,255,0.7);
    transition:all 0.2s ease;
    overflow:hidden;
  }
  .radio-inputs .radio input:checked + .name{
    background:linear-gradient(145deg,#3b82f6,#2563eb);
    color:white;font-weight:600;
    text-shadow:0 1px 2px rgba(0,0,0,0.2);
    box-shadow:
      inset 2px 2px 5px rgba(0,0,0,0.2),
      inset -2px -2px 5px rgba(255,255,255,0.1),
      3px 3px 8px rgba(59,130,246,0.3);
    transform:translateY(2px);
    animation:select 0.3s cubic-bezier(0.4,0,0.2,1);
  }
  .radio-inputs .radio:hover .name{
    background:linear-gradient(145deg,#f0f0f0,#ffffff);
    transform:translateY(-1px);
    box-shadow:
      4px 4px 8px rgba(0,0,0,0.1),
      -4px -4px 8px rgba(255,255,255,0.8);
  }
  .radio-inputs .radio:hover input:checked + .name{
    transform:translateY(1px);
  }
  .radio-inputs .radio:nth-child(2) input:checked + .name{
    background:linear-gradient(145deg,#34d399,#10b981);
    box-shadow:
      inset 2px 2px 5px rgba(0,0,0,0.2),
      inset -2px -2px 5px rgba(255,255,255,0.1),
      3px 3px 8px rgba(16,185,129,0.3);
  }
  .radio-inputs .radio:nth-child(3) input:checked + .name{
    background:linear-gradient(145deg,#fde68a,#f59e0b);
    color:#7c4a03;
    text-shadow:0 1px 2px rgba(255,255,255,0.4);
    box-shadow:
      inset 2px 2px 5px rgba(0,0,0,0.15),
      inset -2px -2px 5px rgba(255,255,255,0.3),
      3px 3px 8px rgba(245,158,11,0.3);
  }
  @keyframes select{
    0%{transform:scale(0.95) translateY(2px);}
    50%{transform:scale(1.05) translateY(-1px);}
    100%{transform:scale(1) translateY(2px);}
  }

  /* ===== SO THEME (green) ===== */
  body.theme-so{
    --accent:#059669;       /* emerald-600 */
    --accent-2:#0d9488;     /* teal-600 */
    --accent-soft:#ecfdf5;  /* emerald-50 */
  }
  body.theme-so .btn.primary{
    box-shadow:0 8px 20px -6px rgba(5,150,105,.5);
  }
  body.theme-so .btn:not(.primary){
    border-color:#a7f3d0;color:#065f46;
  }
  body.theme-so .btn:not(.primary):hover{background:#ecfdf5;border-color:#6ee7b7;}

  /* Saved (yellow) theme btns */
  body.theme-saved .btn.primary{
    background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%);
    box-shadow:0 8px 20px -6px rgba(245,158,11,.55);
  }
  body.theme-saved .btn:not(.primary){
    border-color:#fde68a;color:#7c4a03;
  }
  body.theme-saved .btn:not(.primary):hover{background:#fffbeb;border-color:#fcd34d;}
  body.theme-so .picker-row.active{
    background:linear-gradient(90deg,rgba(5,150,105,.07) 0%, rgba(13,148,136,.04) 100%);
  }
  body.theme-so .saved-row .badge.qcr{background:#dbeafe;color:#1e40af;}
  body.theme-so .saved-row .badge.socr{background:#d1fae5;color:#065f46;}

  /* ===== APP GRID (CR left, picker right) ===== */
  .app-grid{
    max-width:1500px;margin:0 auto 2rem;padding:0 1.25rem;
    display:grid;
    grid-template-columns: minmax(0,1fr) 420px;
    gap:1.25rem;
    align-items:start;
  }
  .cr-col{min-width:0;}
  .sidebar{
    position:sticky;top:1rem;
    max-height:calc(100vh - 2rem);
    display:flex;flex-direction:column;
  }

  /* ===== QUOTATION PICKER ===== */
  .picker{padding:0;}
  .picker-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    box-shadow:var(--shadow-md);
    display:flex;flex-direction:column;
    max-height:calc(100vh - 2rem);
  }
  .picker-head{
    padding:1rem 1.1rem;
    display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#fff 0%, #fafbff 100%);
  }
  .picker-head .label{
    font-weight:700;font-size:.95rem;letter-spacing:-.005em;
    display:flex;align-items:center;gap:.55rem;color:var(--ink);
  }
  .picker-head .label .dot{
    width:8px;height:8px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 0 0 4px rgba(37,99,235,.12);
  }
  .picker-head .count{
    font-size:.7rem;font-weight:700;color:var(--muted);
    background:var(--line-2);padding:.2rem .55rem;border-radius:999px;
    letter-spacing:.04em;
  }
  .search-wrap{margin-left:auto;position:relative;min-width:280px;}
  .search-wrap input{
    width:100%;padding:.6rem .9rem .6rem 2.2rem;
    border-radius:10px;border:1px solid var(--line);
    background:#fff;font:inherit;font-size:.85rem;color:var(--ink);
    transition:border-color .15s, box-shadow .15s;
  }
  .search-wrap input:focus{
    outline:none;border-color:var(--accent);
    box-shadow:0 0 0 4px rgba(37,99,235,.12);
  }
  .search-wrap::before{
    content:"⌕";position:absolute;left:.75rem;top:50%;transform:translateY(-50%);
    font-size:1rem;opacity:.55;font-weight:700;
  }

  .picker-list{
    flex:1;overflow-y:auto;
  }
  .picker-list::-webkit-scrollbar{width:8px;}
  .picker-list::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px;}
  .picker-list::-webkit-scrollbar-track{background:transparent;}

  .picker-row{
    display:flex;align-items:center;gap:.75rem;
    padding:.7rem .9rem;
    border-bottom:1px solid var(--line-2);
    font-size:.82rem;cursor:pointer;
    transition:background .12s ease;
  }
  .picker-row:last-child{border-bottom:none;}
  .picker-row:hover{background:#f8faff;}
  .picker-row.active{
    background:linear-gradient(90deg,rgba(37,99,235,.07) 0%, rgba(124,58,237,.04) 100%);
    box-shadow:inset 3px 0 0 var(--accent);
  }
  .picker-row .row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:.15rem;}
  .picker-row .row-top{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;}
  .picker-row .qno{font-weight:700;color:var(--ink);letter-spacing:-.01em;}
  .picker-row .cust{
    color:var(--ink-soft);font-size:.8rem;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .picker-row .meta{
    color:var(--muted);font-size:.72rem;
    display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;
  }
  .picker-row .meta .dot-sep{color:#cbd5e1;}
  .picker-row .amount{
    font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);
    font-size:.78rem;white-space:nowrap;
  }
  .picker-row .rev{
    display:inline-block;font-size:.62rem;font-weight:700;
    background:#0b1220;color:#fff;padding:1px 7px;border-radius:999px;
    letter-spacing:.04em;
  }
  .picker-row .draft{background:linear-gradient(135deg,#f59e0b,#ef4444);}
  .picker-row .open-btn{
    padding:.35rem .65rem;font-size:.72rem;border-radius:7px;
    border:1px solid var(--accent);
    background:var(--accent);color:#fff;
    cursor:pointer;font-weight:600;letter-spacing:.01em;
    transition:filter .15s, transform .08s;
  }
  .picker-row .open-btn:hover{filter:brightness(1.08);}
  .picker-row .open-btn:active{transform:translateY(1px);}
  .picker-row .open-btn.edit{
    background:#f59e0b;border-color:#d97706;color:#fff;
  }
  .picker-row .open-btn.edit:hover{filter:brightness(1.05);}
  .picker-row .row-editors{
    display:flex;flex-wrap:wrap;gap:.35rem .65rem;margin-top:.3rem;
    font-size:.72rem;color:var(--muted);
  }
  .picker-row .row-editor{display:inline-flex;align-items:center;gap:.25rem;}
  .picker-row .row-editor .who{color:#047857;font-weight:600;}
  /* hide old activity live strip — presence shown inline next to quotation */
  .activity-live{display:none !important;}

  .picker-empty,.loading{padding:2rem 1rem;text-align:center;color:var(--muted);font-size:.88rem;}

  /* ===== SIDEBAR TAB STRIP (Quotations / Activity) ===== */
  .side-tabs{
    display:flex;gap:.3rem;padding:.5rem .6rem 0;border-bottom:1px solid var(--line);
    background:var(--card);
  }
  .side-tab{
    font:inherit;font-size:.78rem;font-weight:600;
    padding:.5rem .8rem;border:none;background:transparent;
    color:var(--muted);cursor:pointer;border-radius:8px 8px 0 0;
    border-bottom:2px solid transparent;margin-bottom:-1px;
    display:inline-flex;align-items:center;gap:.35rem;
    transition:color .15s,border-color .15s,background .15s;
  }
  .side-tab:hover{color:var(--ink);background:#f8faff;}
  .side-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .side-tab .pill{
    font-size:.62rem;background:var(--line-2);color:var(--muted);
    padding:1px 7px;border-radius:99px;font-weight:700;
  }
  .side-tab.active .pill{background:#dbeafe;color:#1e40af;}

  /* Presence dot */
  .presence-dot{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    background:#10b981;box-shadow:0 0 0 2px #fff,0 0 8px rgba(16,185,129,.6);
    animation:presence-pulse 1.6s ease-in-out infinite;
    vertical-align:middle;margin-right:.35rem;
  }
  @keyframes presence-pulse{
    0%,100%{transform:scale(1);opacity:1;}
    50%{transform:scale(1.25);opacity:.65;}
  }
  .picker-row .presence-wrap{display:inline-flex;align-items:center;gap:.2rem;}

  /* Activity panel */
  .activity-panel{display:none;}
  .activity-panel.active{display:block;}
  .quotations-panel{display:block;}
  .quotations-panel.hidden{display:none;}
  .activity-live{
    padding:.55rem .85rem;font-size:.78rem;
    background:linear-gradient(90deg,#ecfdf5 0%,#f0fdfa 100%);
    border-bottom:1px solid #d1fae5;color:#065f46;font-weight:600;
    display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;
  }
  .activity-live:empty{display:none;}
  .activity-live .who{color:#047857;}
  .activity-list{max-height:60vh;overflow-y:auto;}
  .activity-list::-webkit-scrollbar{width:8px;}
  .activity-list::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px;}
  .activity-row{
    padding:.6rem .85rem;border-bottom:1px solid var(--line-2);
    font-size:.78rem;color:var(--ink-soft);
    display:flex;flex-direction:column;gap:.15rem;
  }
  .activity-row:hover{background:#f8faff;}
  .activity-row .top{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;}
  .activity-row .who{font-weight:700;color:var(--ink);}
  .activity-row .badge{
    font-size:.6rem;font-weight:700;letter-spacing:.04em;
    padding:1px 6px;border-radius:99px;text-transform:uppercase;
  }
  .activity-row .badge.open{background:#dbeafe;color:#1e40af;}
  .activity-row .badge.save{background:#d1fae5;color:#065f46;}
  .activity-row .badge.edit{background:#fef3c7;color:#7c4a03;}
  .activity-row .badge.lock{background:#fee2e2;color:#991b1b;}
  .activity-row .badge.rep-change{background:#ede9fe;color:#5b21b6;}
  .activity-row .ts{margin-left:auto;font-size:.7rem;color:var(--muted);}
  .activity-row .detail{font-size:.74rem;color:var(--muted);}
  .activity-row .detail .from{color:#b91c1c;text-decoration:line-through;}
  .activity-row .detail .to{color:#047857;font-weight:600;}
  .activity-empty{padding:2rem 1rem;text-align:center;color:var(--muted);font-size:.85rem;}
  .loading::before{
    content:"";display:inline-block;width:14px;height:14px;
    border:2px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;margin-right:.6rem;vertical-align:-2px;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ===== SAVED RECORDS ===== */
  .saved-panel{max-width:1180px;margin:0 auto 1.5rem;padding:0 1rem;}
  .saved-card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    overflow:hidden;box-shadow:var(--shadow-md);
  }
  .saved-head{
    padding:1rem 1.1rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#fff 0%, #fafbff 100%);
  }
  .saved-head .label{font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:.55rem;}
  .saved-head .label .dot{
    width:8px;height:8px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 0 0 4px rgba(37,99,235,.12);
  }
  .saved-head .count{
    font-size:.7rem;font-weight:700;color:var(--muted);
    background:var(--line-2);padding:.2rem .55rem;border-radius:999px;
  }
  .saved-filters{
    margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;
  }
  .saved-filters .search-wrap{min-width:220px;}
  .saved-filters input[type=date], .saved-filters select{
    padding:.55rem .75rem;border-radius:10px;border:1px solid var(--line);
    background:#fff;font:inherit;font-size:.82rem;color:var(--ink);
  }
  .saved-filters input[type=date]:focus, .saved-filters select:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(37,99,235,.12);
  }
  .saved-table-head{
    display:grid;
    grid-template-columns:90px 1.2fr 2fr 1.2fr 1.3fr 130px;
    gap:.75rem;padding:.6rem 1.1rem;
    font-size:.68rem;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.08em;
    background:var(--line-2);border-bottom:1px solid var(--line);
  }
  .saved-table-head .right{text-align:right;}
  .saved-list{max-height:560px;overflow-y:auto;}
  .saved-list::-webkit-scrollbar{width:8px;}
  .saved-list::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px;}
  .saved-row{
    display:grid;
    grid-template-columns:90px 1.2fr 2fr 1.2fr 1.3fr 130px;
    gap:.75rem;padding:.85rem 1.1rem;align-items:center;
    border-bottom:1px solid var(--line-2);
    font-size:.85rem;cursor:pointer;
    transition:background .12s ease;
  }
  .saved-row:hover{background:#f8faff;}
  .saved-row .badge{
    display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.04em;
    padding:3px 8px;border-radius:999px;text-transform:uppercase;
  }
  .saved-row .badge.qcr{background:#dbeafe;color:#1e40af;}
  .saved-row .badge.socr{background:#d1fae5;color:#065f46;}

  /* Saved mode yellow accent */
  body.theme-saved .saved-head{
    background:linear-gradient(180deg,#fffbeb 0%, #fef3c7 100%);
    border-bottom-color:#fde68a;
  }
  body.theme-saved .saved-head .label .dot{
    background:linear-gradient(135deg,#f59e0b,#d97706);
    box-shadow:0 0 0 4px rgba(245,158,11,.18);
  }
  body.theme-saved .saved-head .count{
    background:#fde68a;color:#7c4a03;
  }
  body.theme-saved .saved-filters input[type=date]:focus,
  body.theme-saved .saved-filters select:focus{
    border-color:#f59e0b;box-shadow:0 0 0 4px rgba(245,158,11,.18);
  }
  body.theme-saved .saved-row:hover{background:#fffbeb;}
  body.theme-saved .saved-row .actions .open{
    background:#f59e0b;border-color:#f59e0b;color:#fff;
  }
  .saved-row .qno{font-weight:700;color:var(--ink);}
  .saved-row .cust{color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .saved-row .meta{color:var(--muted);font-size:.8rem;}
  .saved-row .actions{display:flex;gap:.4rem;justify-content:flex-end;}
  .saved-row .actions button{
    padding:.4rem .65rem;font-size:.72rem;border-radius:8px;
    cursor:pointer;font-weight:600;border:1px solid var(--line);background:#fff;
  }
  .saved-row .actions .open{background:var(--accent);color:#fff;border-color:var(--accent);}
  .saved-row .actions .del{color:#b91c1c;border-color:#fecaca;}
  .saved-row .actions .del:hover{background:#fee2e2;}

  /* ===== A4 PAGE ===== */
  .cr-page{
    width:210mm; min-height:297mm; padding:10mm 8mm;
    margin:1.5rem auto; background:#fff;
    box-shadow:var(--shadow-lg);
    border-radius:6px;
    font-family:'Poppins',sans-serif;
    font-size:8.5pt; line-height:1.25;
    color:var(--ink);
  }
  .cr-title-bar{
    border:1.5px solid var(--border);
    text-align:center;padding:6px 4px;
    font-weight:700;font-size:11pt;color:#2563eb;
    letter-spacing:.02em;
  }
  .cr-subtitle{
    border:1.5px solid var(--border);border-top:none;
    text-align:center;padding:5px 4px;
    font-weight:700;font-size:10pt;letter-spacing:.4em;
  }
  table.cr{
    width:100%;border-collapse:collapse;margin-top:0;
    table-layout:fixed;
  }
  table.cr td{
    border:1px solid var(--border);
    padding:3px 5px;vertical-align:top;
    font-size:8.5pt;
    word-wrap:break-word;
  }
  table.cr td.idx{width:24px;text-align:center;font-weight:500;}
  table.cr td.lbl{font-weight:500;}
  table.cr td.val{font-weight:600;}
  table.cr td.val-hi{font-weight:600;background:transparent;}

  /* Compact: shrink font when cell holds long text */
  table.cr td.compact, table.cr td.compact .cr-edit{
    font-size:7.5pt;line-height:1.18;
  }
  table.cr td.compact-xs, table.cr td.compact-xs .cr-edit{
    font-size:7pt;line-height:1.15;
  }

  /* Editable fields */
  .cr-edit{
    display:inline-block;
    width:100%;min-height:1em;
    border:none;outline:1px dashed transparent;
    background:transparent;font:inherit;color:inherit;
    padding:1px 2px;margin:0;border-radius:3px;
    transition:background .12s, outline-color .12s;
  }
  .cr-edit:hover{outline-color:#cbd5e1;background:#f8fafc;}
  .cr-edit:focus{outline:1.5px solid var(--accent);background:#fff;}

  /* Ex-work / FOR toggle */
  .xw-toggle{cursor:pointer;user-select:none;}
  .xw-toggle .xw-on{font-weight:700;color:var(--ink);}
  .xw-toggle .xw-off{text-decoration:line-through;color:#94a3b8;font-weight:500;}
  .xw-toggle .xw-sep{color:#94a3b8;font-weight:500;}
  .xw-toggle:hover .xw-off{color:#64748b;}

  .sig-cell{
    height:18mm;position:relative;text-align:center;padding:2px;
    overflow:hidden;
  }
  .sig-cell img{
    max-height:16mm;max-width:85%;object-fit:contain;
    display:block;margin:1.5mm auto 0;
  }
  .sig-cell .sig-label{position:absolute;left:4px;top:2px;font-weight:600;font-size:7.5pt;}
  .sig-cell .sig-name{position:absolute;left:0;right:0;bottom:1px;font-size:7pt;color:var(--muted);}

  /* Responsive */
  @media (max-width: 1100px){
    .app-grid{grid-template-columns:1fr;}
    .sidebar{position:static;max-height:none;}
    .picker-card{max-height:480px;}
  }
  @media (max-width: 720px){
    .search-wrap{min-width:0;width:100%;}
    .app-tabs{padding:0 1rem;}
    .app-grid{padding:0 1rem;}
  }

  /* PRINT */
  @media print{
    @page { size: A4; margin: 7mm; }
    html,body{background:#fff;}
    .app-topbar,.app-header,.app-tabs,.app-grid > .sidebar,.picker,.print-hide{display:none !important;}
    .app-grid{display:block;padding:0;}
    .cr-page{
      box-shadow:none;margin:0;padding:0;border-radius:0;
      width:auto;min-height:auto;
      page-break-inside:avoid;break-inside:avoid;
      font-size:8pt;line-height:1.22;
    }
    .cr-page table.cr td{padding:2.5px 5px;font-size:8pt;}
    .cr-page .cr-title-bar{font-size:10.5pt;padding:5px 4px;}
    .cr-page .cr-subtitle{font-size:9.5pt;padding:4px 4px;}
    .cr-page .sig-cell{height:16mm;}
    .cr-page .sig-cell img{max-height:14mm;margin-top:1mm;}
    table.cr,table.cr tbody,table.cr tr,table.cr td{
      page-break-inside:avoid !important;break-inside:avoid !important;
    }
    .cr-edit{outline:none !important;background:transparent !important;}
  }
</style>
</head>
<body>

<header class="app-header print-hide">
  <div class="app-brand">
    <span class="title">Contract Review <span class="ver">V1</span></span>
    <span class="subtitle">Venus Engineering Works</span>
  </div>
  <div class="toolbar">
    <button class="btn" onclick="loadList()" title="Reload from Firebase">
      <span>↻</span><span>Reload</span>
    </button>
    <button class="btn" id="btnSaveCR" onclick="saveCR()" title="Save CR to records">
      <span>💾</span><span>Save CR</span>
    </button>
    <button class="btn primary" onclick="window.print()">
      <span>🖨</span><span>Print / Save PDF</span>
    </button>
  </div>
</header>

<nav class="app-tabs print-hide">
  <div class="radio-inputs">
    <label class="radio">
      <input type="radio" name="appTab" id="tabQuotation" checked onclick="setMode('qcr')">
      <span class="name">📄 Quotation CR</span>
    </label>
    <label class="radio">
      <input type="radio" name="appTab" id="tabSO" onclick="setMode('socr')">
      <span class="name">📦 SO CR</span>
    </label>
    <label class="radio">
      <input type="radio" name="appTab" id="tabSaved" onclick="setMode('saved')">
      <span class="name">📁 Saved Records</span>
    </label>
  </div>
</nav>

<div class="app-grid">
  <main class="cr-col">
    <div id="crRoot">
      <div style="padding:2rem;text-align:center;color:var(--muted);font-size:.9rem;">
        Select a record from the right to render the Contract Review.
      </div>
    </div>
  </main>

  <aside class="sidebar print-hide">
    <section class="picker">
      <div class="picker-card">
        <div class="side-tabs">
          <button class="side-tab active" id="sideTabQuot" onclick="switchSideTab('quot')"><span id="sideTabQuotLabel">Quotations</span> <span class="pill" id="qCount">—</span></button>
          <button class="side-tab" id="sideTabAct" onclick="switchSideTab('act')">Activity <span class="pill" id="actCount">0</span></button>
        </div>
        <div class="quotations-panel" id="quotationsPanel">
          <div class="picker-head">
            <span class="label"><span class="dot"></span><span id="pickerTitle">Select a Quotation</span></span>
            <div class="search-wrap" style="flex-basis:100%;margin:0;">
              <input id="qSearch" type="text" placeholder="Search by no or customer..." oninput="renderList()" autocomplete="off">
            </div>
          </div>
          <div class="picker-list" id="qList">
            <div class="loading">Loading…</div>
          </div>
        </div>
        <div class="activity-panel" id="activityPanel">
          <div class="activity-live" id="activityLive"></div>
          <div class="activity-list" id="activityList">
            <div class="activity-empty">No activity yet.</div>
          </div>
        </div>
      </div>
    </section>
  </aside>
</div>

<!-- ===== SAVED RECORDS PANEL (full-width, hidden by default) ===== -->
<section id="savedPanel" class="saved-panel print-hide" style="display:none;">
  <div class="saved-card">
    <div class="saved-head">
      <span class="label"><span class="dot"></span>Saved CR Records</span>
      <span class="count" id="savedCount">—</span>
      <div class="saved-filters">
        <div class="search-wrap">
          <input id="savedSearch" type="text" placeholder="Search by no or customer..." oninput="renderSaved()" autocomplete="off">
        </div>
        <select id="savedModeFilter" onchange="renderSaved()">
          <option value="">All types</option>
          <option value="qcr">Quotation CR</option>
          <option value="socr">SO CR</option>
        </select>
        <select id="savedRepFilter" onchange="renderSaved()">
          <option value="">All sales reps</option>
        </select>
        <input id="savedDateFrom" type="date" onchange="renderSaved()" title="Saved from">
        <input id="savedDateTo"   type="date" onchange="renderSaved()" title="Saved to">
        <button class="btn" onclick="loadSavedRecords()">↻ Reload</button>
      </div>
    </div>
    <div class="saved-table-head">
      <div>Type</div>
      <div>Source No</div>
      <div>Customer</div>
      <div>Sales Rep</div>
      <div>Saved At</div>
      <div class="right">Actions</div>
    </div>
    <div class="saved-list" id="savedList">
      <div class="loading">Loading saved records…</div>
    </div>
  </div>
</section>

};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let _mode = 'qcr';                 // 'qcr' / 'socr' / 'saved'
const _caches = { qcr: {}, socr: {} };
const _selected = { qcr: null, socr: null };
let _savedCache = {};              // CR records loaded from cr_saved collection
let _pendingEdits = null;          // edits map to apply after next renderCR()

// Collection + label per mode
const MODE_CFG = {
  qcr:  { coll: 'quotations',   pickerTitle: 'Select a Quotation',  loadingMsg: 'Loading quotations…',  tabLabel: 'Quotations' },
  socr: { coll: 'sales_orders', pickerTitle: 'Select a Sales Order', loadingMsg: 'Loading sales orders…', tabLabel: 'Sales Orders' }
};

function _cache()       { return _caches[_mode]; }
function _selectedKey() { return _selected[_mode]; }

const fmt = {
  esc(s){
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  },
  date(d){
    if (!d) return '';
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
    if (m) return `${m[3]}/${m[2]}/${m[1]}`;
    return String(d);
  },
  money(n){
    const v = parseFloat(n) || 0;
    return v.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
};

/* ============================================================
   MODE / TAB SWITCH
============================================================ */
function setMode(mode){
  if (!['qcr','socr','saved'].includes(mode)) return;
  _mode = mode;
  // Update tab UI
  document.getElementById('tabQuotation').checked = (mode === 'qcr');
  document.getElementById('tabSO').checked        = (mode === 'socr');
  document.getElementById('tabSaved').checked     = (mode === 'saved');
  document.body.classList.toggle('theme-so', mode === 'socr');
  document.body.classList.toggle('theme-saved', mode === 'saved');

  // Toggle layout: saved tab = full-width records panel, others = picker+CR
  const grid       = document.querySelector('.app-grid');
  const savedPanel = document.getElementById('savedPanel');
  const saveBtn    = document.getElementById('btnSaveCR');
  if (mode === 'saved'){
    grid.style.display       = 'none';
    savedPanel.style.display = 'block';
    if (saveBtn) saveBtn.style.display = 'none';
    loadSavedRecords();
    return;
  }
  grid.style.display       = '';
  savedPanel.style.display = 'none';
  if (saveBtn) saveBtn.style.display = '';

  document.getElementById('pickerTitle').textContent = MODE_CFG[mode].pickerTitle;
  const tabLbl = document.getElementById('sideTabQuotLabel');
  if (tabLbl) tabLbl.textContent = MODE_CFG[mode].tabLabel;
  const sb = document.getElementById('qSearch');
  if (sb) sb.value = '';
  if (Object.keys(_cache()).length){
    renderList();
    const sel = _selectedKey();
    if (sel && _cache()[sel]) renderCR(_cache()[sel]);
    else clearCR();
  } else {
    loadList();
  }
}

function clearCR(){
  document.getElementById('crRoot').innerHTML =
    `<div style="padding:2rem;text-align:center;color:var(--muted);font-size:.9rem;">
       Select a record from the right to render the Contract Review.
     </div>`;
}

/* ============================================================
   FIREBASE LOAD
============================================================ */
async function loadList(){
  const cfg = MODE_CFG[_mode];
  document.getElementById('qList').innerHTML = `<div class="loading">${fmt.esc(cfg.loadingMsg)}</div>`;
  try {
    const [snap, savedSnap] = await Promise.all([
      db.collection(cfg.coll).get(),
      db.collection('cr_saved').get()
    ]);
    _caches[_mode] = {};
    snap.forEach(doc => { _caches[_mode][doc.id] = doc.data(); });
    _savedCache = {};
    savedSnap.forEach(doc => { _savedCache[doc.id] = doc.data(); });
    // DEBUG — log every doc key + its _quotNo/quotNo so we can see what's missing
    console.table(Object.entries(_caches[_mode]).map(([k, v]) => ({
      docKey: k,
      _quotNo: v._quotNo || '(none)',
      quotNo:  v.quotNo  || '(none)',

/** Adapter — normalizes both quotation and SO docs to a common shape for picker + renderer */
function adaptDoc(data){
  if (!data) return {};
  // SO docs use _custName/_custLocation/_quotNo; quotation docs use custName/custLocation/quotNo
  const isSO = (_mode === 'socr');
  return {
    ...data,
    custName:     data.custName     ?? data._custName     ?? '',
    custLocation: data.custLocation ?? data._custLocation ?? '',
    quotNo:       data.quotNo       ?? data._quotNo       ?? '',
    // SO doesn't have quotDate field directly; use _quotDate or _poDate
    quotDate:     data.quotDate     ?? data._quotDate     ?? data._poDate ?? '',
    // SO doesn't have grandTotal; compute from items
    grandTotal:   data.grandTotal != null
                    ? data.grandTotal
                    : (Array.isArray(data.items) ? data.items.reduce((s,i)=>s+(parseFloat(i.amt)||0),0) : null),
    _displayNo:   isSO ? (data._soNo || data._quotNo || '') : (data._quotNo || data.quotNo || '')
  };
}

/** Group docs, pick latest non-draft revision per number */
function buildList(filter){
  const q = (filter || '').trim().toLowerCase();
  const grouped = {};
  const cache = _cache();
  for (const [key, raw] of Object.entries(cache)){
    const data = adaptDoc(raw);
    const num = data._displayNo || data.quotNo || '(unknown)';
    if (q){
      const cust = (data.custName || '').toLowerCase();
      if (!num.toLowerCase().includes(q) && !cust.includes(q)) continue;
    }
    const isDraft = key.endsWith('_draft');
    let rev = isDraft ? -1 : 0;
    if (!isDraft){
      const m = key.match(/_R(\d+)$/);
      if (m) rev = parseInt(m[1]);
    }
    if (!grouped[num]) grouped[num] = [];
    grouped[num].push({ key, rev, raw, data, isDraft });
  }
  const rows = [];
  for (const [num, arr] of Object.entries(grouped)){
    arr.sort((a, b) => b.rev - a.rev);
    rows.push({ num, ...arr[0], allRevs: arr });
  }
  rows.sort((a, b) => {
    const ad = a.data.quotDate || '';
    const bd = b.data.quotDate || '';
    if (ad !== bd) return bd.localeCompare(ad);
    return b.num.localeCompare(a.num);
  });
  return rows;
}

/* ============================================================
   MAP + RENDER CR
============================================================ */
function pickTerm(terms, prefix){
  if (!Array.isArray(terms)) return '';
  const p = prefix.toLowerCase();
  for (const t of terms){
    const lower = String(t || '').trim().toLowerCase();
    if (lower.startsWith(p)){
      return String(t).slice(prefix.length).replace(/^\s*:?\s*/, '').trim();
    }
  }
  return '';
}

/** Delivery rule:
 *   - "10 to 12 weeks" / "8-12 weeks" -> "12 Weeks" (take the upper bound)
 *   - "12 weeks" -> "12 Weeks"
 *   - any explicit date inside the string -> the date (dd/mm/yyyy)
 *   - otherwise -> raw value as-is
 */
/** Shorten verbose warranty boilerplate.
 *   "For one year from the date of use, or one and half years from the date of Dispatch,
 *    which ever is earlier, in our usual format. Conditions Apply."
 *   -> "1 yr from use or 1½ yrs from dispatch, whichever earlier."
 */
function shortenWarranty(raw){
  if (!raw) return '';
  const s = String(raw).toLowerCase();
  // Detect the standard 1 year / 1½ year boilerplate (any phrasing variant)
  const hasOneYear  = /\b(one|1)\s*year\b/.test(s) || /\b1\s*yr\b/.test(s);
  const hasHalfYear = /(one and half|1\s*½|1\.5)\s*year/.test(s) || /1½\s*yr/.test(s);
  if (hasOneYear && hasHalfYear){
    return '1 yr from use or 1½ yrs from dispatch, whichever earlier.';
  }
  return raw;
}

function normalizeDelivery(raw){
  if (!raw) return '';
  const s = String(raw).trim();

  // 1) ISO date or dd/mm/yyyy / dd-mm-yyyy in the text
  const isoMatch = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (isoMatch) return `${isoMatch[3]}/${isoMatch[2]}/${isoMatch[1]}`;
  const dmyMatch = s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if (dmyMatch){
    const dd = dmyMatch[1].padStart(2,'0');
    const mm = dmyMatch[2].padStart(2,'0');
    let yy   = dmyMatch[3];
    if (yy.length === 2) yy = (parseInt(yy) > 50 ? '19' : '20') + yy;
    return `${dd}/${mm}/${yy}`;
  }

  // 2) Range like "10 to 12 weeks" / "8-12 weeks" / "10 - 12 wks" -> upper bound
  const rangeMatch = s.match(/(\d+)\s*(?:to|-|–|—)\s*(\d+)\s*(week|weeks|wk|wks|day|days|month|months)/i);
  if (rangeMatch){
    const upper = rangeMatch[2];
    const unit  = /day/i.test(rangeMatch[3]) ? 'Days'
               : /month/i.test(rangeMatch[3]) ? 'Months'
               : 'Weeks';
    return `${upper} ${unit}`;
  }

  // 3) Single value like "12 weeks"
  const singleMatch = s.match(/(\d+)\s*(week|weeks|wk|wks|day|days|month|months)/i);
  if (singleMatch){
    const unit = /day/i.test(singleMatch[2]) ? 'Days'
              : /month/i.test(singleMatch[2]) ? 'Months'
              : 'Weeks';
    return `${singleMatch[1]} ${unit}`;
  }

  // 4) Fallback — return as-is
  return s;
}

function mapToCR(rawDoc){
  // Normalize SO/quotation field name differences before mapping
  const d = adaptDoc(rawDoc || {});
  const terms    = d.terms || [];
  const payment  = pickTerm(terms, 'Payment');
  const delivery = normalizeDelivery(pickTerm(terms, 'Delivery'));
  const warranty = '1 yr from the date of use / 1½ yrs from the date of dispatch, whichever earlier, in our usual format, Conditions Apply.';
  const packing  = pickTerm(terms, 'Packing');
  const transit  = pickTerm(terms, 'Transit');

  // Taxes: SEZ/EXPORT → NOT APPLICABLE, otherwise Applicable
  const taxType = (d.taxType || 'GST').toUpperCase();
  const taxes = (taxType === 'SEZ' || taxType === 'EXPORT') ? 'NOT APPLICABLE' : 'Applicable';

  // Validity: only the date from quotation (validTill), formatted dd/mm/yyyy
  const validity = d.validTill ? fmt.date(d.validTill) : '';

  const custName = [d.custName, d.custLocation].filter(Boolean).join(', ');
  const firstDesc = (d.items && d.items[0] && d.items[0].desc) ? d.items[0].desc : '';
  const totalQty = d.totalQty != null
    ? d.totalQty
    : (Array.isArray(d.items) ? d.items.reduce((s,i)=>s+(i.isRegret?0:(parseFloat(i.qty)||0)),0) : 0);

  const repKey = (d.salesRep || '').trim().toUpperCase();
  const repSig = (typeof REP_SIGNATURES === 'object' && REP_SIGNATURES[repKey]) ? REP_SIGNATURES[repKey] : '';

  // Today (dd/mm/yyyy) for the printed DATE cell at bottom
  const today = new Date();
  const todayStr =
    String(today.getDate()).padStart(2,'0') + '/' +
    String(today.getMonth()+1).padStart(2,'0') + '/' +
    today.getFullYear();

  // For SO mode: "Enquiry" row → PO No/Date, "Quotation" row → quote no/date
  // For Quotation mode: "Enquiry" row → refNo/refDate (RFQ), "Quotation" row → quote no/date
  const isSO = (_mode === 'socr');
  const enquiryNo   = isSO ? (rawDoc._poNo   || '') : (d.refNo  || '');
  const enquiryDate = isSO ? (rawDoc._poDate || '') : (d.refDate || '');

  return {
    enquiryNo,
    enquiryDate,
    quotNo:        d.quotNo || '',
    quotDate:      d.quotDate || '',
    soNo:          rawDoc._soNo || '',
    isSO,
    crDate:        todayStr,
    custName:      custName,
    specification: firstDesc,            // ITEM cell + Specification cell both use this
    quantity:      totalQty ? String(totalQty) : '',
    paymentTerms:  payment,
    taxes:         taxes,
    taxType:       taxType,
    gstNo:         '24AAACG6864F1ZO',
    delivery:      delivery || '12 Weeks',
    transitForms:  'Applicable',
    transitChg:    transit || 'Our A/C',
    packing:       packing || 'Our A/C',
    warranty:      warranty || '1 yr from the date of use / 1½ yrs from the date of dispatch, whichever earlier, in our usual format, Conditions Apply.',
    validity:      validity,
    grandTotal:    d.grandTotal,
    salesRep:      d.salesRep || '',
    repSignature:  repSig,
    enquiryFrom:   d.kindAttn || '',     // "Enquiry From" = Kind Attention contact
    exwork:        'FOR'                 // default selection, user can toggle
  };
}

  const forSpan = el.querySelector('span:nth-child(1)');
  const exwSpan = el.querySelector('span:nth-child(3)');
  const forOn = forSpan.classList.contains('xw-on');

  forSpan.classList.toggle('xw-off',  forOn);
  exwSpan.classList.toggle('xw-on',   forOn);
  exwSpan.classList.toggle('xw-off', !forOn);

  const valEl = el.closest('tr')?.querySelector('.cr-edit');
  if (valEl){
    valEl.textContent = forOn ? 'Ex-Works' : 'FOR';
  }

/** Override .cr-edit text values from a saved-edits map { eid: text }. */

/** Snapshot all .cr-edit values keyed by their stable eid. */
function collectEditedValues(){

/* ============================================================
   SAVED CR RECORDS  (collection: cr_saved)
   Doc id = "<mode>__<sourceKey>"
   Doc shape = {
     mode, sourceKey, sourceNo, custName, salesRep,
     savedAt (ISO), savedBy, edits: { eid: text }
   }
============================================================ */

function _crDocId(mode, sourceKey){
  return `${mode}__${sourceKey.replace(/\//g,'-')}`;
}

async function saveCR(){
  if (_mode !== 'qcr' && _mode !== 'socr'){
    alert('Open a Quotation or SO CR before saving.');
    return;
  }
  const sourceKey = _selectedKey();
  if (!sourceKey){
    alert('Select a record first.');
    return;
  }
  const raw = _cache()[sourceKey];
  if (!raw){ alert('Source record not found.'); return; }

  const adapted = adaptDoc(raw);
  const cr = mapToCR(raw); // for label only

  const payload = {
    mode:       _mode,
    sourceKey:  sourceKey,
    sourceNo:   adapted._displayNo || adapted.quotNo || sourceKey,
    custName:   adapted.custName || '',
    salesRep:   raw.salesRep || raw._salesRep || '',
    savedAt:    new Date().toISOString(),
    savedBy:    raw.salesRep || raw._salesRep || '',
    edits:      collectEditedValues(),
    quotNo:     adapted.quotNo || '',
    quotDate:   adapted.quotDate || '',
    soNo:       raw._soNo || '',
    poNo:       raw._poNo || '',
    grandTotal: adapted.grandTotal != null ? adapted.grandTotal : null
  };

  const docId = _crDocId(_mode, sourceKey);
  const btn = document.getElementById('btnSaveCR');
  if (btn){ btn.disabled = true; btn.querySelector('span:last-child').textContent = 'Saving…'; }
  try {
    await db.collection('cr_saved').doc(docId).set(payload);
    _savedCache[docId] = payload;
    if (typeof renderList === 'function' && (_mode === 'qcr' || _mode === 'socr')) renderList();
    if (btn){ btn.querySelector('span:last-child').textContent = 'Saved ✓'; }
    setTimeout(() => {
      if (btn){ btn.disabled = false; btn.querySelector('span:last-child').textContent = 'Save CR'; }
    }, 1200);
  } catch(e){
    alert('Save failed: ' + (e.message || e));
    if (btn){ btn.disabled = false; btn.querySelector('span:last-child').textContent = 'Save CR'; }
  }
}

async function loadSavedRecords(){
  document.getElementById('savedList').innerHTML =
    '<div class="loading">Loading saved records…</div>';
  try {
    const snap = await db.collection('cr_saved').get();
    _savedCache = {};
    snap.forEach(doc => { _savedCache[doc.id] = doc.data(); });
    populateRepFilter();
    renderSaved();
  } catch(e){
    document.getElementById('savedList').innerHTML =
      `<div class="picker-empty">Failed to load: ${fmt.esc(e.message || e)}</div>`;
    console.error(e);

}

function populateRepFilter(){
  const sel = document.getElementById('savedRepFilter');
  if (!sel) return;
  const reps = new Set();
  Object.values(_savedCache).forEach(r => { if (r.salesRep) reps.add(r.salesRep); });
  const current = sel.value;
  sel.innerHTML = '<option value="">All sales reps</option>' +
    Array.from(reps).sort().map(r => `<option value="${fmt.esc(r)}">${fmt.esc(r)}</option>`).join('');
  if (current) sel.value = current;

function renderSaved(){
  const q     = (document.getElementById('savedSearch').value || '').trim().toLowerCase();
  const mode  = document.getElementById('savedModeFilter').value;
  const rep   = document.getElementById('savedRepFilter').value;
  const dFrom = document.getElementById('savedDateFrom').value;
  const dTo   = document.getElementById('savedDateTo').value;

  let rows = Object.entries(_savedCache).map(([id, data]) => ({ id, ...data }));

  if (mode) rows = rows.filter(r => r.mode === mode);
  if (rep)  rows = rows.filter(r => (r.salesRep || '') === rep);
  if (q){
    rows = rows.filter(r =>
      (r.sourceNo || '').toLowerCase().includes(q) ||
      (r.custName || '').toLowerCase().includes(q));
  }
  if (dFrom) rows = rows.filter(r => (r.savedAt || '').slice(0,10) >= dFrom);
  if (dTo)   rows = rows.filter(r => (r.savedAt || '').slice(0,10) <= dTo);

  rows.sort((a,b) => (b.savedAt || '').localeCompare(a.savedAt || ''));

  const countEl = document.getElementById('savedCount');
  countEl.textContent = rows.length + (rows.length === 1 ? ' record' : ' records');

  const list = document.getElementById('savedList');
  if (!rows.length){
    list.innerHTML = '<div class="picker-empty">No saved records match your filters.</div>';
    return;
  }
  list.innerHTML = rows.map(r => {
    const badge = r.mode === 'socr'
      ? '<span class="badge socr">SO CR</span>'
      : '<span class="badge qcr">Quote CR</span>';
    const savedAt = r.savedAt
      ? new Date(r.savedAt).toLocaleString('en-IN', { dateStyle:'medium', timeStyle:'short' })
      : '';
    return `
      <div class="saved-row" onclick="loadFromSaved('${fmt.esc(r.id)}')">
        <div>${badge}</div>
        <div><span class="qno">${fmt.esc(r.sourceNo || '')}</span></div>
        <div class="cust">${fmt.esc(r.custName || '—')}</div>
        <div class="meta">${fmt.esc(r.salesRep || '')}</div>
        <div class="meta">${fmt.esc(savedAt)}</div>
        <div class="actions">
          <button class="open" onclick="event.stopPropagation();loadFromSaved('${fmt.esc(r.id)}')">Open</button>
          <button class="del"  onclick="event.stopPropagation();deleteSaved('${fmt.esc(r.id)}')">Delete</button>
        </div>
      </div>`;
  }).join('');
}

async function loadFromSaved(id){
  const rec = _savedCache[id];
  if (!rec){ alert('Record not found.'); return; }
  // Ensure source collection is loaded
  const targetMode = rec.mode;
  if (!Object.keys(_caches[targetMode]).length){
    try {
      const snap = await db.collection(MODE_CFG[targetMode].coll).get();
      _caches[targetMode] = {};
      snap.forEach(d => { _caches[targetMode][d.id] = d.data(); });
    } catch(e){ alert('Failed to load source collection: ' + e.message); return; }
  }
  let raw = _caches[targetMode][rec.sourceKey];
  let effectiveKey = rec.sourceKey;
  if (!raw){
    // Original ref deleted — fall back to latest available revision for same base no.
    const baseNo = String(rec.sourceKey).replace(/_draft$/, '').replace(/_R\d+$/, '');
    const candidates = Object.keys(_caches[targetMode])
      .filter(k => k === baseNo || k.startsWith(baseNo + '_R') || k === baseNo + '_draft')
      .map(k => {
        let rev;
        if (k.endsWith('_draft'))      rev = -1;
        else if (k === baseNo)         rev = 0;
        else { const m = k.match(/_R(\d+)$/); rev = m ? parseInt(m[1]) : -2; }
        return { k, rev };
      })
      .filter(c => c.rev >= 0) // skip drafts unless nothing else
      .sort((a,b) => b.rev - a.rev);
    let pick = candidates[0];
    if (!pick){
      // Only draft left? try that
      const draftKey = baseNo + '_draft';
      if (_caches[targetMode][draftKey]) pick = { k: draftKey, rev: -1 };
    }
    if (!pick){
      alert('Source record (' + rec.sourceKey + ') no longer exists in ' + MODE_CFG[targetMode].coll + '.\nNo other revisions of "' + baseNo + '" found.');
      return;
    }
    effectiveKey = pick.k;
    raw = _caches[targetMode][effectiveKey];
    const pickLbl = pick.rev === -1 ? 'Draft' : (pick.rev === 0 ? 'Original' : 'R' + pick.rev);
    console.warn('[CR] Source ' + rec.sourceKey + ' missing → using ' + pickLbl + ' (' + effectiveKey + ')');
  }
  // Switch to source mode, queue edits, render
  _selected[targetMode] = effectiveKey;
  _pendingEdits = rec.edits || {};
  setMode(targetMode);
  // setMode will re-render the CR using the cached selection
}

async function deleteSaved(id){
  if (!confirm('Delete this saved CR record? This cannot be undone.')) return;
  try {
    await db.collection('cr_saved').doc(id).delete();
    delete _savedCache[id];
    renderSaved();
  } catch(e){
    alert('Delete failed: ' + (e.message || e));
  }
}

/* ============================================================
   ACTIVITY + PRESENCE
   Collections:
     activity/{autoId}      — events
     presence/{recordKey}/sessions/{sessionId} — heartbeat docs
============================================================ */
const _sessionId = 'sess_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
let _currentUser = '';                 // derived from loaded cr.salesRep
let _currentRecordKey = '';            // "<mode>__<sourceKey>"
let _currentRecordNo  = '';
let _activityUnsub = null;
let _presenceUnsub = null;
let _presenceTimer = null;
let _globalPresenceUnsub = null;
let _globalPresence = {};              // recordKey -> Set<user>
const PRESENCE_TTL_MS = 35000;
let _editBaseline = {};                // {eid: text} captured at render
let _lastLoggedSalesRep = '';
const _loggedCollisions = new Set();

function _now(){ return firebase.firestore.FieldValue.serverTimestamp(); }
function _recKey(mode, sourceKey){ return `${mode}__${(sourceKey||'').replace(/\//g,'-')}`; }

async function logActivity(action, payload){
  if (!_currentUser) return;
  try {
    await db.collection('activity').add({
      ts: _now(),
      tsClient: Date.now(),
      user: _currentUser,
      action,
      mode: _mode,
      recordKey: _currentRecordKey || '',
      recordNo:  _currentRecordNo || '',
      ...payload
    });
  } catch(e){ console.warn('activity log failed', e); }
}

async function pruneActivity(){
  try {
    const cutoff = Date.now() - 24*60*60*1000;
    const snap = await db.collection('activity').where('tsClient','<', cutoff).get();
    const batch = db.batch();
    snap.forEach(d => batch.delete(d.ref));
    if (!snap.empty) await batch.commit();
  } catch(e){ console.warn('prune failed', e); }
}

/* ---------- presence ---------- */
async function _presenceWrite(){
  if (!_currentRecordKey || !_currentUser) return;
  try {
    await db.collection('presence').doc(_currentRecordKey)
      .collection('sessions').doc(_sessionId)
      .set({ user:_currentUser, recordKey:_currentRecordKey, lastSeen:Date.now(), ts:_now() });
  } catch(e){ /* ignore */ }
}
async function _presenceClear(recordKey){
  if (!recordKey) return;
  try {
    await db.collection('presence').doc(recordKey)
      .collection('sessions').doc(_sessionId).delete();
  } catch(e){}
}

function startPresence(){
  stopPresence();
  if (!_currentRecordKey) return;
  _presenceWrite();
  _presenceTimer = setInterval(_presenceWrite, 20000);
  // Live listener for who else is on this record
  _presenceUnsub = db.collection('presence').doc(_currentRecordKey)
    .collection('sessions')
    .onSnapshot(snap => {
      const cutoff = Date.now() - 35000;
      const others = [];
      const all = [];
      snap.forEach(doc => {
        const d = doc.data();
        if (!d || (d.lastSeen||0) < cutoff) return;
        all.push(d.user);
        if (doc.id !== _sessionId) others.push(d.user);
      });
      renderLiveStrip(all);
      // collision detection
      others.forEach(u => {
        if (u && u !== _currentUser){
          const key = _currentRecordKey + '|' + u;
          if (!_loggedCollisions.has(key)){
            _loggedCollisions.add(key);
            logActivity('lock', { collidingWith: u, note: `${u} also editing` });
          }
        }
      });
    });
}
function stopPresence(){
  if (_presenceTimer){ clearInterval(_presenceTimer); _presenceTimer = null; }
  if (_presenceUnsub){ _presenceUnsub(); _presenceUnsub = null; }
  const prev = _currentRecordKey;
  if (prev) _presenceClear(prev);
}
window.addEventListener('beforeunload', () => { _presenceClear(_currentRecordKey); });

function startGlobalPresence(){
  if (_globalPresenceUnsub) return;
  try {
    _globalPresenceUnsub = db.collectionGroup('sessions')
      .onSnapshot(snap => {
        const cutoff = Date.now() - PRESENCE_TTL_MS;
        const map = {};
        snap.forEach(doc => {
          const d = doc.data() || {};
          if (!d.recordKey || !d.user) return;
          if ((d.lastSeen || 0) < cutoff) return;
          (map[d.recordKey] = map[d.recordKey] || new Set()).add(d.user);
        });
        _globalPresence = map;
        if (typeof renderList === 'function') renderList();
      }, err => { console.warn('global presence failed', err); });
  } catch(e){ console.warn('collectionGroup unsupported', e); }
}

function presenceFor(sourceKey){
  const k = _recKey(_mode, sourceKey);
  const set = _globalPresence[k];
  if (!set) return [];
  return Array.from(set);
}

function renderLiveStrip(){ /* removed: presence now inline in picker rows */ }

function startActivityFeed(){

function _fmtAgo(ts){
  if (!ts) return '';
  const diff = Date.now() - ts;
  if (diff < 60000)   return Math.floor(diff/1000) + 's ago';
  if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
  if (diff < 86400000)return Math.floor(diff/3600000) + 'h ago';
  return new Date(ts).toLocaleString('en-IN', { dateStyle:'short', timeStyle:'short' });
}

function renderActivityList(rows){
  const list = document.getElementById('activityList');
  if (!list) return;
  if (!rows.length){
    list.innerHTML = '<div class="activity-empty">No activity yet.</div>';
    return;
  }
  list.innerHTML = rows.map(r => {
    const action = r.action || '';
    let detail = '';
    if (action === 'edit'){
      detail = `<div class="detail">${fmt.esc(r.field||'')}: <span class="from">${fmt.esc(r.oldVal||'')}</span> → <span class="to">${fmt.esc(r.newVal||'')}</span></div>`;
    } else if (action === 'rep-change'){
      detail = `<div class="detail">Rep <span class="from">${fmt.esc(r.oldVal||'')}</span> → <span class="to">${fmt.esc(r.newVal||'')}</span></div>`;
    } else if (action === 'lock'){
      detail = `<div class="detail">${fmt.esc(r.note||'concurrent edit detected')}</div>`;
    } else if (action === 'open'){
      detail = `<div class="detail">Opened ${fmt.esc(r.recordNo||'')}</div>`;
    } else if (action === 'save'){
      detail = `<div class="detail">Saved ${fmt.esc(r.recordNo||'')}</div>`;
    }
    return `<div class="activity-row">
      <div class="top">
        <span class="badge ${fmt.esc(action)}">${fmt.esc(action)}</span>
        <span class="who">${fmt.esc(r.user||'')}</span>
        <span class="ts">${_fmtAgo(r.tsClient)}</span>
      </div>
      ${detail}
    </div>`;
  }).join('');
}

/* ---------- hook into existing render/save flow ---------- */
const _origRenderCR = window.renderCR;
window.renderCR = function(data){
  // Stop presence on previous record
  stopPresence();
  _origRenderCR(data);
  _currentUser = (data && (data.salesRep || data._salesRep)) || _currentUser || 'Anonymous';
  _lastLoggedSalesRep = _currentUser;
  const sourceKey = _selectedKey() || '';
  _currentRecordKey = _recKey(_mode, sourceKey);
  _currentRecordNo = (data && (data._displayNo || data.quotNo || data._soNo || sourceKey)) || sourceKey;
  // Capture baseline for edit diffs
  _editBaseline = {};
  document.querySelectorAll('#crRoot .cr-edit').forEach(el => {
    _editBaseline[el.dataset.eid] = el.textContent;
  });
  // Wire edit-blur listeners
  document.querySelectorAll('#crRoot .cr-edit').forEach(el => {
    el.addEventListener('blur', _onCellBlur);
  });
  if (_currentRecordKey){
    if (_currentUser) logActivity('open', {});
    startPresence();
  }
};

function _onCellBlur(ev){
  const el = ev.target;
  const eid = el.dataset.eid;
  if (!eid) return;
  const oldVal = _editBaseline[eid] != null ? _editBaseline[eid] : '';
  const newVal = el.textContent;
  if (oldVal === newVal) return;
  _editBaseline[eid] = newVal;
  // Try to label field — find nearest preceding .lbl in same row (left of edited cell)
  let field = eid;
  const td = el.closest('td');
  if (td){
    let prev = td.previousElementSibling;
    while (prev){
      if (prev.classList && prev.classList.contains('lbl')){
        field = prev.textContent.trim().replace(/\s+/g,' ').slice(0,80) || eid;
        break;
      }
      prev = prev.previousElementSibling;
    }
    // Fallback: if no preceding lbl, try first .lbl in row
    if (field === eid){
      const tr = td.parentElement;
      const firstLbl = tr && tr.querySelector('.lbl');
      if (firstLbl) field = firstLbl.textContent.trim().replace(/\s+/g,' ').slice(0,80) || eid;
    }
  }
  // Detect rep-change
  if (/sales rep|salesrep/i.test(field) || (field === eid && _isLikelyRepField(el))){
    logActivity('rep-change', { field, oldVal, newVal });
    _currentUser = newVal || _currentUser;
  } else {
    logActivity('edit', { field, oldVal, newVal });
  }
}
function _isLikelyRepField(){ return false; }

const _origSaveCR = window.saveCR;
window.saveCR = async function(){
  await _origSaveCR();
  logActivity('save', {});
};

// ============================================================
// URL-PARAM AUTO-LOAD — used by SO_Generator to embed a CR preview
// Usage: QuotationCR.html?cr=qcr__QT2627043   or  ?cr=socr__SO2627044
// Add &print=1 to auto-open the browser print dialog after render.
// Add &embed=1 to hide picker/sidebar (modal/iframe-friendly view).
// ============================================================
(async function autoLoadFromURL(){
  try {
    const params = new URLSearchParams(location.search);
    const crId   = params.get('cr');
    if (!crId) return;
    const wantPrint = params.get('print') === '1';
    const embed    = params.get('embed') === '1';

    if (embed){
      // Hide chrome (header, tabs, sidebar, saved panel) — show only the CR render area
      const st = document.createElement('style');
      st.textContent = `
        html, body { background:#fff !important; }
        .app-header, .app-tabs, .print-hide, .sidebar, #savedPanel { display:none !important; }
        .app-grid { display:block !important; grid-template-columns:none !important; padding:0 !important; max-width:100% !important; }
        .cr-col { width:100% !important; padding:0 !important; }
        .cr-page { box-shadow:none !important; margin:0 auto !important; }
      `;
      document.head.appendChild(st);
    }

    // Determine target mode from prefix
    const mode = crId.startsWith('socr__') ? 'socr' : 'qcr';

    // Switch to target mode (triggers loadList for that collection)
    setMode(mode);

    // Wait for source collection to load
    await new Promise(r => {
      const check = () => Object.keys(_caches[mode] || {}).length ? r() : setTimeout(check, 150);
      check();
    });

    // Load the saved CR cache
    await loadSavedRecords();

    // Wait for the saved record to appear, then render
    let tries = 0;
    const tryLoad = async () => {
      if (_savedCache && _savedCache[crId]){
        await loadFromSaved(crId);
        if (wantPrint){
          // Give renderCR a beat to apply pending edits, then print
          setTimeout(() => window.print(), 800);
        }
        return;
      }
      if (tries++ < 40) setTimeout(tryLoad, 250);
      else console.warn('[CR auto-load] record not found:', crId);
    };
    tryLoad();
  } catch(e){ console.warn('[CR auto-load] failed', e); }
})();
</script>
